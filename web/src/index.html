<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildLens</title>
<style>
  :root { --accent:#e4002b; --ink:#16181d; --muted:#5f6672; --glass:rgba(255,255,255,.82); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:var(--ink); background:#eceef2; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { width:100%; height:100%; display:block; }
  .card { background:var(--glass); backdrop-filter:blur(18px); border-radius:18px; box-shadow:0 6px 30px rgba(0,0,0,.12); }
  button { font:inherit; border:0; border-radius:12px; padding:10px 16px; cursor:pointer; background:#e3e6ec; color:var(--ink); }
  button:hover { filter:brightness(.96); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); color:#fff; font-weight:600; }
  #top { position:fixed; top:14px; left:14px; right:14px; display:flex; gap:10px; align-items:center; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #header { flex:1; max-width:560px; padding:10px 16px; }
  #stepLabel { font-weight:700; font-size:17px; }
  #bar { height:5px; background:#d6d9df; border-radius:3px; margin-top:7px; overflow:hidden; }
  #progress { height:100%; background:var(--accent); width:0; transition:width .25s; }
  #tools { display:flex; gap:8px; align-items:center; padding:8px 10px; margin-left:auto; flex-wrap:wrap; font-size:14px; }
  #tools label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  #voice.on { background:var(--accent); color:#fff; }
  #voiceStatus { color:var(--accent); font-size:13px; min-width:0; }
  #bottom { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(760px, calc(100% - 28px)); }
  #panel { padding:14px; }
  #subassembly { color:#d26a00; font-weight:600; margin-bottom:8px; }
  #parts { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .part { position:relative; flex:0 0 auto; width:96px; text-align:center; font-size:11px; color:var(--muted); }
  .part img, .part .noimg { width:76px; height:76px; object-fit:contain; background:#fff; border-radius:12px; padding:4px; display:block; margin:0 auto; }
  .part .noimg { font-size:40px; line-height:68px; }
  .part .count { position:absolute; top:58px; right:6px; background:rgba(0,0,0,.78); color:#fff; font-weight:700; font-size:12px; border-radius:9px; padding:1px 7px; }
  .part .pname { display:block; margin-top:4px; line-height:1.25; }
  #slider { width:100%; margin:12px 0 10px; accent-color:var(--accent); }
  #controls { display:flex; gap:10px; }
  #controls .grow { flex:1; }
  #finishedCard { padding:20px; text-align:center; }
  #finishedCard h2 { margin:0 0 12px; }
  #glasses { position:fixed; right:14px; top:84px; width:min(420px, 40vw); padding:10px; }
  #hudBox { position:relative; aspect-ratio:4/3; background:#000; border-radius:10px; overflow:hidden; }
  #hudImg { width:100%; height:100%; object-fit:contain; }
  #hudText { position:absolute; inset:10px; color:#5cff80; font:12px/1.35 Consolas,monospace; text-shadow:0 0 2px #000; display:flex; flex-direction:column; }
  #hudText b { font-size:18px; }
  .hudparts { margin-top:auto; }
  #glasses p { margin:6px 2px 0; font-size:11px; color:var(--muted); }
  #homeScreen { position:fixed; inset:0; background:linear-gradient(#0e183a,#20387a); color:#fff; display:flex; align-items:center; justify-content:center; z-index:10; }
  #homeInner { text-align:center; max-width:640px; padding:24px; }
  #hero { max-width:100%; max-height:42vh; filter:drop-shadow(0 18px 30px rgba(0,0,0,.4)); }
  #homeInner h1 { margin:10px 0 6px; font-size:28px; }
  #setStats { opacity:.8; }
  #setId { opacity:.55; font-size:13px; margin-top:4px; }
  #start { margin-top:22px; font-size:18px; padding:14px 36px; }
  .tips { margin-top:22px; font-size:13px; opacity:.75; line-height:1.6; }
  kbd { background:rgba(255,255,255,.18); border-radius:5px; padding:1px 6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="top">
  <button id="home" class="card" title="Home">⌂</button>
  <div id="header" class="card">
    <div id="stepLabel">Step 1</div>
    <div id="bar"><div id="progress"></div></div>
  </div>
  <div id="tools" class="card">
    <label><input type="checkbox" id="focus"> Focus on new</label>
    <label><input type="checkbox" id="readAloud"> Read aloud</label>
    <button id="voice" title="Voice control (Chrome / Edge)">🎤 Voice</button>
    <span id="voiceStatus"></span>
    <button id="glassesToggle" title="Glasses preview (G)">👓 Glasses</button>
  </div>
</div>

<div id="glasses" class="card" hidden>
  <div id="hudBox"><img id="hudImg" alt=""><div id="hudText"></div></div>
  <p>Glasses preview · 640×480 · what the smart glasses will show</p>
</div>

<div id="bottom">
  <div id="panel" class="card">
    <div id="subassembly" hidden></div>
    <div id="parts"></div>
    <input type="range" id="slider" min="0" max="0" step="1" value="0">
    <div id="controls">
      <button id="back" class="grow">‹ Back</button>
      <button id="replay" title="Replay step (R)">⟳</button>
      <button id="zoomIn" title="Zoom in (+)">＋</button>
      <button id="zoomOut" title="Zoom out (−)">－</button>
      <button id="next" class="grow primary">Next ›</button>
    </div>
  </div>
  <div id="finishedCard" class="card" hidden>
    <h2>You built it! 🏁</h2>
    <button id="lastStep">‹ Last step</button>
    <button id="again" class="primary">Build again</button>
  </div>
</div>

<div id="homeScreen">
  <div id="homeInner">
    <img id="hero" alt="">
    <h1 id="setName"></h1>
    <div id="setStats"></div>
    <div id="setId"></div>
    <button id="start" class="primary">Start building</button>
    <div class="tips">
      <kbd>←</kbd> <kbd>→</kbd> change steps · <kbd>R</kbd> replay · <kbd>G</kbd> glasses preview<br>
      Drag to orbit · scroll to zoom · right-drag to pan · say “next” with 🎤 Voice on
    </div>
  </div>
</div>

<script>window.BUILD_DATA = /*BUILD_DATA*/null;</script>
<script>/*APP_JS*/</script>
</body>
</html>
